name: Storybook A11y

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'packages/ui/**'
      - 'apps/dashboard/**'
      - 'packages/config/src/storybook/**'
      - 'pnpm-lock.yaml'

concurrency:
  group: storybook-a11y-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storybook-a11y:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ui, dashboard]
        include:
          - package: ui
            static_path: packages/ui/storybook-static
          - package: dashboard
            static_path: apps/dashboard/storybook-static

    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @rpg/ui playwright:install

      - name: Build Storybook
        run: pnpm --filter @rpg/${{ matrix.package }} build-storybook --quiet

      - name: Upload Storybook build on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storybook-static-${{ matrix.package }}
          path: ${{ matrix.static_path }}

      - name: Run Storybook a11y tests
        run: pnpm --filter @rpg/${{ matrix.package }} test-storybook:ci
